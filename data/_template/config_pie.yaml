# Conventional FPM, no position correction.
# Only algorithm settings belong here; anything that describes the instrument
# or the stored data belongs in config.yaml. Every key is optional and
# defaults to the value shown.

upscale: 4                    # object side length / measured side length
iterations: 9                 # sweeps over all LEDs
alpha: 1.0                    # object-update regulariser (delta_1 in the paper)
beta: 1.0                     # pupil-update regulariser (delta_2 in the paper, which states 1000)

# A method file may override the patch position for this method alone,
# without changing the instrument facts in config.yaml:
# model:
#   sample_offset_x_mm: 0.0
#   sample_offset_y_mm: 0.0
