# Facts about the stored measurements and the instrument. Algorithm settings
# belong in config_<method>.yaml.

dataset:
  name: replace_me
  notes: ""

data:
  file: raw/replace_me.mat
  key: imSeqLowRes
  layout: HWI                 # any explicit I/H/W order; the MATLAB stacks are HWI

optics:
  wavelength_m: 6.297e-7
  na: 0.1
  magnification: 4.0
  pixel_size_sensor_m: 6.5e-6   # PCO.edge 4.2

led:
  array_size: 17              # LEDs per side that were lit; frames are in raster order
  pitch_m: 4.0e-3
  height_m: 113.5e-3          # LED array to sample

model:
  # Centre of the reconstructed patch in the sample plane, relative to the
  # optical axis: image_center in the MATLAB code, with x = image_center(2)
  # and y = image_center(1). A patch whose centre is r rows below and c
  # columns right of the sensor centre has image_center = [-r -c] px, so
  #   sample_offset_x_mm = -c x 1.625e-3,  sample_offset_y_mm = -r x 1.625e-3
  # (6.5 um pixels / 4x). The signs were checked by locating every dataset's
  # centre frame in the full sensor frame: [700 600] is 700 px up, 600 px left.
  sample_offset_x_mm: 0.0
  sample_offset_y_mm: 0.0
  defocus_m: 0.0
