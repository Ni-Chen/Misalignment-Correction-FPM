# pcFPM: per-LED annealing plus a rigid array fit (pie_solver_led.m).
# Only algorithm settings belong here. Every key is optional and defaults to
# the value shown.

upscale: 4
iterations: 9                 # outer iterations; each restarts the object and pupil (loop)
sweeps_per_iteration: 11      # the last one anneals every LED's centre (tt1 = 1..11)
search_radius_px: 12.0        # dkshift
search_radius_divisor: 1.3    # radius / 1.3 ...
divided_search_iterations: 8  # ... in the first 8 outer iterations (tt < 9)
fit_array_size: 5             # only the central 5 x 5 LEDs enter the array fit ...
fit_warmup_iterations: 5      # ... in the first 5 outer iterations (tt < 6)
pose_bounds:                  # fmincon bounds, relative to the nominal array
  x_mm: [-4.0, 4.0]
  y_mm: [-4.0, 4.0]
  rotation_deg: [-2.0, 2.0]
  height_mm: [0.0, 6.5]       # 113.5 to 120 mm
alpha: 1.0
beta: 1.0
seed: 0
print_every: 10               # non-zero prints the fitted pose after every outer iteration; 0 disables

search_function_tolerance: 1.0e-3
search_stall_iterations: 1000
search_max_function_evaluations: 6000
