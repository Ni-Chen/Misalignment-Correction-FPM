  pitch_m: 4.0e-3
  height_m: 113.0e-3

model:
  sample_offset_x_mm: 0     # +0 px x 1.625e-3 mm
  sample_offset_y_mm: 0     # +0 px x 1.625e-3 mm
  defocus_m: 0.0
